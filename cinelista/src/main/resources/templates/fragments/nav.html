<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Barra de navegacion final (Bootstrap). La pagina activa se marca con la variable "activa" del modelo. -->
<nav th:fragment="nav" class="navbar navbar-expand-md navbar-dark barra-cine">
    <div class="container">
        <a class="navbar-brand" th:href="@{/mi-lista}">CineLista</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu-principal" aria-controls="menu-principal"
                aria-expanded="false" aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu-principal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${activa == 'mi-lista'} ? 'active'" th:href="@{/mi-lista}">Mi lista</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activa == 'anadir-titulo'} ? 'active'" th:href="@{/anadir-titulo}">Añadir título</a></li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
